version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - gocheckcompilerdirectives
    - gochecknoinits
    - goconst
    - gocritic
    - gosec
    - iotamixing
    - lll
    - loggercheck
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - nakedret
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - perfsprint
    - predeclared
    - promlinter
    - reassign
    - recvcheck
    - staticcheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    depguard:
      rules:
        prevent_unmaintained_packages:
          list-mode: strict
          files:
            - $all
            - '!$test'
          allow:
            - $gostd
            - github.com/aauren/rtorrent/rtorrent
            - github.com/aauren/rtorrent-exporter
            - github.com/prometheus
            - k8s.io/klog
            - github.com/spf13/viper
            - github.com/spf13/cobra
    lll:
      line-length: 140
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - mnd
        text: 'Magic number: [0-9]{1},'
      - linters:
          - mnd
        text: 'Magic number: 0[0-7]{3},'
      - linters:
          - mnd
        text: 'Magic number: 255,'
      - linters:
          - mnd
        text: 'Magic number: 32,'
      - linters:
          - mnd
        text: 'Magic number: 10,'
      - linters:
          - lll
        path: _test\.go
      - linters:
          - gochecknoinits
        path: .*/cmd/.*\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
